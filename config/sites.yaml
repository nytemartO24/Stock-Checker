# Which sites and products are checked. No secrets here — the Discord
# webhook lives in .env (see .env.example).
#
# Per-site rate_limit blocks override these key by key. They exist because
# one Shopify JSON request answering a whole collection and one Amazon page
# load per ASIN per market cannot share a single global limit.
#
# `country` is mandatory for Shopify sites and load-bearing: a Shopify
# Markets store prices in the VISITOR's country, so without it the same URL
# returns a different currency depending on request headers, and nothing in
# the response says which one you got. Pinning it to SE means every price
# this project reports is what it would cost delivered to Sweden — directly
# comparable across sites, and to Amazon's SEK figures.

defaults:
  rate_limit:
    min_delay_seconds: 1.0
    max_delay_seconds: 3.0
    timeout_seconds: 30
    max_retries: 3

sites:
  popsplanet:
    type: shopify
    enabled: true
    domain: www.popsplanet.it
    # Locale prefix this store serves its English catalogue under.
    base_path: /en
    country: SE
    # Single-market store: verified to quote EUR regardless of country.
    currency: EUR
    currency_symbol: "€"
    collections:
      - beyblade-x-booster
      - beyblade-x-starter-pack
      - beyblade-x-double-pack

  amazon:
    type: amazon
    enabled: true
    # Matches the news-notifier pilot's production markets. nl/be/it/pl are
    # supported in markets.py and can be added by name.
    markets: [se, de, fr, es]
    # Where deliveries are quoted TO. Every market is pinned to this one
    # destination so their answers mean the same thing — without it Amazon
    # geolocates a different country per marketplace and the results stop
    # being comparable. Postcode applies to the domestic market only.
    delivery_country: Sweden
    delivery_postcode: "37116"
    # A listing above reference * this is flagged as a suspected scalp.
    # Scalping on this line runs 4-5x, so 2.0 has plenty of margin.
    scalp_multiplier: 2.0
    # false = suppress the notification instead of tagging it. Detection,
    # logging and state recording continue either way.
    alert_on_suspected_scalp: true
    headless: true
    # Optional per-ASIN ceilings in SEK, for products where the automatic
    # reference misbehaves. Deliberately empty: auto-reference first.
    max_price_sek: {}
    watchlist:
      - B0FCYT9DG6  # Shark Scale
      - B0H1RKP3KL  # Tread Croc
      - B0H1RFQ9L3  # Glare Cyclops
      - B0DNFQ99JW  # Reaper Incendio
      - B0DN6YLGRX  # Silver Wolf
      - B0H95JF9D9  # Delta Unicorn
    rate_limit:
      # A browser page-load is far heavier than a JSON request, and this is
      # 24 of them per run (6 ASINs x 4 markets).
      min_delay_seconds: 2.0
      max_delay_seconds: 5.0

  toysnowman:
    type: shopify
    enabled: true
    domain: toysnowman.com
    country: SE
    # Shopify Markets store: with country=SE it quotes SEK. Its base
    # currency is CAD — do not assume one from the domain.
    currency: SEK
    currency_symbol: "kr"
    collections:
      - beyblade
