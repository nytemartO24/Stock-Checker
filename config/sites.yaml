# Which sites and products are checked. No secrets here — the Discord
# webhook lives in .env (see .env.example).
#
# Per-site rate_limit blocks override these key by key. They exist because
# one Shopify JSON request answering a whole collection and one Amazon page
# load per ASIN per market cannot share a single global limit.
#
# `country` is mandatory for Shopify sites and load-bearing: a Shopify
# Markets store prices in the VISITOR's country, so without it the same URL
# returns a different currency depending on request headers, and nothing in
# the response says which one you got. Pinning it to SE means every price
# this project reports is what it would cost delivered to Sweden — directly
# comparable across sites, and to Amazon's SEK figures.

defaults:
  rate_limit:
    min_delay_seconds: 1.0
    max_delay_seconds: 3.0
    timeout_seconds: 30
    max_retries: 3

sites:
  popsplanet:
    type: shopify
    enabled: true
    domain: www.popsplanet.it
    # Locale prefix this store serves its English catalogue under.
    base_path: /en
    country: SE
    # Single-market store: verified to quote EUR regardless of country.
    currency: EUR
    currency_symbol: "€"
    collections:
      - beyblade-x-booster
      - beyblade-x-starter-pack
      - beyblade-x-double-pack
    # Terms identifying the products worth NOTIFYING about. Everything in
    # the collections above is still tracked (one request covers the whole
    # collection, so it is free, and it keeps price history plus a
    # first_seen date for spotting newcomers) — this only decides what may
    # interrupt you. EMPTY MEANS EVERYTHING.
    #
    # Entries are exact product HANDLES (slugs), not title terms. Title
    # matching was tried and dropped: names are not word-order stable (the
    # item quoted as "Shark Scale" is titled "Scale Shark 4-50UF") and a term
    # also matches bundles merely containing the product. Look a handle up
    # with: scripts/audit_store.py <store> --find "<term>"
    # A product never seen before alerts ONCE, regardless of the watchlist —
    # you cannot watchlist something that does not exist yet, which is how a
    # four-item bundle was missed. It is recorded on that run, so it is never
    # "new" again. Set false if a store bulk-adding stock gets noisy.
    alert_on_new_products: true
    watchlist:
      - beyblade-x-booster-scale-shark-450uf                # Scale Shark 4-50UF
      - beyblade-x-starter-pack-sterling-wolf-380-fb-ux     # Sterling Wolf 3-80FB
      - beyblade-x-starter-pack-reaper-incendio-t-470k-cx   # Reaper Incendio T 4-70K
      # Handle does NOT contain the product name — this is Delta Unicorn PO
      # 3-60GU. Proof that handles must be looked up, never derived.
      - beyblade-x-starter-pack-guadalupe-mountains         # Delta Unicorn PO 3-60GU
      # Tread Croc and Glare Cyclops are not stocked here, standalone or in a
      # bundle, within the collections above.

  amazon:
    type: amazon
    enabled: true
    # Matches the news-notifier pilot's production markets. nl/be/it/pl are
    # supported in markets.py and can be added by name.
    markets: [se, de, fr, es]
    # Where deliveries are quoted TO. Every market is pinned to this one
    # destination so their answers mean the same thing — without it Amazon
    # geolocates a different country per marketplace and the results stop
    # being comparable. Postcode applies to the domestic market only.
    delivery_country: Sweden
    # Set DELIVERY_POSTCODE in .env, not here — a postcode identifies a town,
    # and this file is committed. Used on the domestic market only (the other
    # markets validate the field against their own country and can only take
    # a country selection).
    delivery_postcode: ""
    # An estimate further out than this is treated as NOT available yet: an
    # add-to-cart button and a date six months away is not something you can
    # have. It sets in_stock false rather than just muting the alert, so the
    # date coming inside the window reads as a normal restock and you are told
    # when the item becomes actually available. The listing still reports its
    # real date, and the alert says plainly that it was orderable but too far
    # out. Set to 0 or remove to disable.
    max_delivery_days: 90
    # How many days earlier a delivery estimate must move before it pings.
    # Amazon nudges its estimates by a day constantly, so a low value here is
    # a spam machine. Measured against the last date you were ALERTED about,
    # not the last one seen, so a date creeping earlier one day at a time
    # still eventually pings once instead of being lost under the threshold.
    min_improvement_days: 7
    # A listing above reference * this is flagged as a suspected scalp.
    # Scalping on this line runs 4-5x, so 2.0 has plenty of margin.
    scalp_multiplier: 2.0
    # false = suppress the notification instead of tagging it. Detection,
    # logging and state recording continue either way.
    alert_on_suspected_scalp: true
    headless: true
    # Optional per-ASIN ceilings in SEK, for products where the automatic
    # reference misbehaves. Deliberately empty: auto-reference first.
    max_price_sek: {}
    # Fallback used ONLY when an ASIN has no observed Amazon-sold price —
    # the scalper case, where the only sightings are third-party. The
    # product's title is classified by type (see sites/amazon/tiers.py) and
    # judged against these.
    #
    # Calibrated from 162 real products across both Shopify stores,
    # normalized to SEK. These are CEILINGS (roughly the observed maximum
    # plus headroom), not averages: weak evidence should not cry wolf on a
    # legitimately pricier item of the same type. Re-derive them if the
    # product line shifts. `unknown` is deliberately absent — an
    # unclassifiable product falls through to "price unverified" rather
    # than being judged against a number we made up.
    tier_ceilings_sek:
      booster: 190      # observed 93-180
      starter: 210      # observed 93-202
      dual: 350         # observed 164-338
      bundle: 620       # observed 356-605
      set: 520          # observed 128-498
      accessory: 230    # observed 93-214
    watchlist:
      - B0FCYT9DG6  # Shark Scale
      - B0H1RKP3KL  # Tread Croc
      - B0H1RFQ9L3  # Glare Cyclops
      - B0DNFQ99JW  # Reaper Incendio
      - B0DN6YLGRX  # Silver Wolf
      - B0H95JF9D9  # Delta Unicorn
      # Seize Jaguar HN UX Infinity Starter Pack. ONE ASIN, FOUR NAMES — amazon.se
      # calls it "Hasbro BEY BBX Browns Canyon" (a Hasbro park codename, same
      # family as ginza's "Bbx Kobuk Valley") while de/fr/es all spell out "Seize
      # Jaguar HN UX". Verified 2026-09-09 to resolve on all four markets;
      # currently unavailable on every one, which is the point of watching it.
      - B0H1RB48HK  # Seize Jaguar HN UX  (= .se "Browns Canyon")
    rate_limit:
      # A browser page-load is far heavier than a JSON request, and this is
      # 24 of them per run (6 ASINs x 4 markets).
      min_delay_seconds: 2.0
      max_delay_seconds: 5.0

  ginza:
    type: ginza
    enabled: true
    # Its search page renders client-side, so this uses the JSON endpoint the
    # page itself calls. One request covers the whole catalogue.
    #
    # SEARCH TERM MATTERS: Ginza lists Takara Tomy names, not Hasbro ones —
    # Scale Shark 4-50UF is "BEYBLADE Bbx Kobuk Valley". Its titles say "BBX",
    # never "Beyblade X", so searching for the latter returns nothing. Plain
    # "beyblade" is the widest net and returns the whole range (22 products).
    search: beyblade
    currency: SEK
    currency_symbol: "kr"
    # Watchlist entries are Ginza's own numeric product ids, visible in the
    # product URL: /product/<slug>/<id>/. Nothing here can be shared with
    # another store's list, because the names do not correspond.
    watchlist: []
    alert_on_new_products: true
    title_exclude:
      # Same back-catalogue pruning as the other stores. Checked against the
      # real 22 titles, not guessed.
      - beyblade burst
      - switchstrike
      - metal fusion
      - metal masters
      - grevolution
      - vforce
      - evolution
    rate_limit:
      # A single JSON call per run; no need to hurry it.
      min_delay_seconds: 1.0
      max_delay_seconds: 3.0

  gameshop:
    type: woocommerce
    enabled: true
    domain: gameshop.se
    # Whatever URL lists the products. There is no Beyblade category here —
    # products sit under generic ones (leksaker, funko-pop) — so a search is
    # the right list. It returns 153 products over 4 pages, in-stock first
    # then out-of-stock, which matters: we must SEE a product while it is
    # unavailable in order to notice it coming back. 104 survive the
    # title_exclude below.
    listing_path: /?s=beyblade&post_type=product
    currency: SEK
    currency_symbol: "kr"
    # Its Store API is 403 (Cloudflare) and the WordPress core API carries no
    # price or stock, so this is parsed from the server-rendered HTML. No
    # browser needed — WooCommerce stamps instock/outofstock on each tile.
    title_exclude:
      # This store sells the whole Beyblade back-catalogue and the anime on
      # disc alongside current Beyblade X toys, so the listing needs more
      # pruning than the Shopify stores. Counts are from the 2026-09-09
      # inventory; every term was checked against the real titles rather than
      # guessed.
      - beyblade burst    # 22 — different product line (same call as toysnowman)
      # A Burst sub-line whose titles never say "Burst", so the term above
      # cannot catch it — and because they say "Starter Pack" they landed in
      # that tier. Evidence that an exclusion list needs periodic review as a
      # store adds back-catalogue, not just one pass.
      - switchstrike      # 6  — older Burst sub-line
      - let it rip        # 5  — anime on DVD
      - metal masters     # 5  — older toy line
      - metal fusion      # 4  — older toy line
      - "pop "            # 4  — Funko Pop figures, not toys
      - evolution         # 4  — anime DVDs and "Evolution Toy Bundle Pack"
      - grevolution       # 2  — anime DVD
      - vforce            # 2  — anime DVD
      - backpack          # 1  — merchandise
    watchlist:
      - beyblade-x-scale-shark-4-50uf-attack                            # Scale Shark 4-50UF
      - beyblade-x-sterling-wolf-3-80-fb-ux-starter-pack                # Sterling Wolf 3-80FB
      - beyblade-x-starter-pack-cx-reaper-incendio-t-4-70k-balance-type  # Reaper Incendio T
      # Tread Croc, Delta Unicorn and Glare Cyclops are not stocked here at
      # all — recorded so their absence reads as checked, not forgotten.
    alert_on_new_products: true
    rate_limit:
      # HTML pages are heavier than a JSON call, and this is 4 of them.
      min_delay_seconds: 1.5
      max_delay_seconds: 4.0

  rarewaves:
    type: rarewaves
    enabled: true
    # A Shopify store that sites/shopify.py CANNOT serve: 1348 collections and
    # no Beyblade one. /collections/beyblade answers 200 with zero products,
    # which is worse than a 404 — it reads as a working, empty collection. So
    # the listing comes from its own search API (Klevu), like ginza.
    #
    # NOTE: UK-based. It quotes SEK and ships here, but shipping is not
    # comparable to an EU store's — it is tracked because the price is good and
    # the catalogue is unusually complete, not because it is convenient.
    search: beyblade
    currency: SEK
    currency_symbol: "kr"
    # Klevu answers in GBP and only GBP. Setting this makes the module fetch
    # Shopify's own SEK price for an item that is in stock AND may notify —
    # a handful of requests, not one per product. Remove it to keep GBP.
    price_country: SE
    # WATCHLIST ENTRIES ARE EANs. Unique to this store: every handle and sku
    # here IS the barcode, so an entry can be derived from a barcode instead of
    # looked up by hand. Everywhere else this is impossible.
    watchlist:
      - "5010996385222"  # Scale Shark 4-50UF          (= ginza "Bbx Kobuk Valley")
      - "5010996385086"  # Reaper Rhino C 4-55D starter
      - "5010996385321"  # Stun Medusa 9-60GB starter
      - "5010996309457"  # Drop Attack Battle Set
    alert_on_new_products: true
    title_exclude:
      # This store sells the anime on disc and the manga volumes next to the
      # toys, and the whole Beyblade back-catalogue. Same pruning as elsewhere.
      - beyblade burst
      - switchstrike
      - metal fusion
      - metal masters
      - metal fury
      - grevolution
      - vforce
      - "vol."
      - "vol "
      - saison
      - coffret
    rate_limit:
      # Two POSTs per run for the whole catalogue, plus a price lookup only for
      # items that would alert.
      min_delay_seconds: 1.0
      max_delay_seconds: 3.0

  lereservoir:
    type: lereservoir
    enabled: true
    # Luxembourg. Found by harvesting OpenStreetMap, and the one store that made
    # that harvest worth doing — it had Delta Unicorn PO 3-60GU in stock as
    # "Fig Beyblade X Guadalupe Mountains".
    #
    # BOTH listings are polled and unioned because NEITHER IS COMPLETE: the
    # shop's own search for "beyblade" returns 2 Beyblade products while the
    # Hasbro category contains 4. Measured, not assumed.
    listing_paths:
      - /catalogue-gamme-hasbro-parent-3386.html   # the real catalogue: 4 of 12 are Beyblade
      - /?s=beyblade&post_type=product             # catches anything filed outside Hasbro
    currency: EUR
    currency_symbol: "€"
    # The Hasbro range here is mostly Star Wars, so this filter is load-bearing
    # rather than tidying.
    title_include:
      - beyblade
    # WATCHLIST ENTRIES ARE EANs — the tile's own id is the barcode, and it
    # repeats in the product URL. Same as rarewaves, unlike everywhere else.
    watchlist:
      - "5010996431134"  # Fig Beyblade X Guadalupe Mountains = Delta Unicorn PO 3-60GU
      - "5010996431189"  # Fig Beyblade X Great Sand Dunes
      - "5010996438584"  # Fig Beyblade X Great Smokey Mountains
      - "5010996309518"  # Starter Pack Beyblade X Courage Dran S 6-60V CX
    alert_on_new_products: true
    rate_limit:
      # Two page loads per run against a small shop.
      min_delay_seconds: 2.0
      max_delay_seconds: 4.0

  toysnowman:
    type: shopify
    enabled: true
    domain: toysnowman.com
    country: SE
    # Shopify Markets store: with country=SE it quotes SEK. Its base
    # currency is CAD — do not assume one from the domain.
    currency: SEK
    currency_symbol: "kr"
    collections:
      - beyblade
    # Terms identifying the products worth NOTIFYING about. Everything in
    # the collections above is still tracked (one request covers the whole
    # collection, so it is free, and it keeps price history plus a
    # first_seen date for spotting newcomers) — this only decides what may
    # interrupt you. EMPTY MEANS EVERYTHING.
    #
    # Entries are exact product HANDLES (slugs), not title terms. Title
    # matching was tried and dropped: names are not word-order stable (the
    # item quoted as "Shark Scale" is titled "Scale Shark 4-50UF") and a term
    # also matches bundles merely containing the product. Look a handle up
    # with: scripts/audit_store.py <store> --find "<term>"
    # A product never seen before alerts ONCE, regardless of the watchlist —
    # you cannot watchlist something that does not exist yet, which is how a
    # four-item bundle was missed. It is recorded on that run, so it is never
    # "new" again. Set false if a store bulk-adding stock gets noisy.
    alert_on_new_products: true
    watchlist:
      - beyblade-x-scale-shark-4-50uf-ux-booster-pack       # Scale Shark 4-50UF
      # Bundles are watched deliberately: a 4-pack containing Tread Croc went
      # by unnoticed once, which is part of why this project exists.
      - beyblade-x-tread-croc-tq-5-50gn-cx-whip-brachio-ow-5-70nr-cx-nether-incendio-z-ux-suppress-superion-0-70lp-bx-infinity-starter-pack-bundle
      # This one contains BOTH Delta Unicorn and Glare Cyclops.
      - beyblade-x-delta-unicorn-po-3-60gu-cx-glory-valkerion-lf-ux-seize-jaguar-hn-ux-glare-cyclops-7-55fb-bx-infinity-starter-pack-bundle
    # This store has ONE beyblade collection, mixing product generations, so
    # an unwanted line can only be dropped by title. EXCLUDE the old
    # generation rather than trying to include the current one by name:
    # "BBX" is Takara Tomy's branding for Beyblade X, so a `beyblade x`
    # include-filter silently dropped a product that qualifies. Beyblade
    # Burst is the only genuinely different line in here.
    title_exclude:
      - beyblade burst
