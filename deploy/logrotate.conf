# Installed to /etc/logrotate.d/stock-checker by deploy/setup.sh, which
# substitutes __APP_DIR__. logrotate already runs daily on Debian, so no
# extra scheduling is needed once this file is in place.
#
# copytruncate because cron appends to these files with >> and holds the
# descriptor for the length of a run; renaming out from under it would send
# the rest of that run's output into the rotated file.
__APP_DIR__/logs/*.log {
    weekly
    rotate 4
    compress
    missingok
    notifempty
    copytruncate
}
